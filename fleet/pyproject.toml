[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fleet"
version = "0.0.0"
description = "Repo-to-Harbor-task pipeline (successor to stress_stack)"
requires-python = ">=3.12"
dependencies = [
  "click>=8.1",
  "rich>=13.0",
  "tree-sitter>=0.23",
  "tree-sitter-language-pack>=0.9",
  "pathspec>=1.1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10"]

[project.scripts]
fleet = "fleet.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

# The .scm query files are the per-language half of the graph engine — without
# them an installed fleet parses nothing but Python.
[tool.setuptools.package-data]
"fleet.graph" = ["queries/*.scm"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
